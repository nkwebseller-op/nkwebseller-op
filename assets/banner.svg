<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="NK Digital Craft - Websites, UI/UX, SEO, AI and Automation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f1a"/>
      <stop offset="100%" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <style>
      .title { font: 800 64px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #f8fafc; letter-spacing: 1px; }
      .sub { font: 500 22px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #94a3b8; letter-spacing: 3px; }
      .tag { font: 600 15px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e2e8f0; }
      .fadeUp { opacity: 0; animation: fadeUp 1s ease-out forwards; }
      .d1 { animation-delay: 0.2s; }
      .d2 { animation-delay: 0.6s; }
      .d3 { animation-delay: 1.0s; }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; }
      @keyframes pulse { 0%,100% { opacity: 0.35; } 50% { opacity: 1; } }
      .flow { stroke-dasharray: 10 14; animation: flow 3s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -240; } }
      .sweep { animation: sweep 4s ease-in-out infinite; }
      @keyframes sweep { 0% { transform: translateX(-300px); opacity: 0; } 20% { opacity: 0.9; } 80% { opacity: 0.9; } 100% { transform: translateX(1500px); opacity: 0; } }
      .node { animation: pulse 2s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; } }
    </style>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <circle cx="980" cy="160" r="260" fill="url(#glow)"/>

  <g stroke="#1e293b" stroke-width="1" opacity="0.8">
    <path d="M0 80 H1200 M0 160 H1200 M0 240 H1200"/>
    <path d="M150 0 V320 M300 0 V320 M450 0 V320 M600 0 V320 M750 0 V320 M900 0 V320 M1050 0 V320"/>
  </g>

  <g fill="none" stroke="url(#accent)" stroke-width="2" class="flow" opacity="0.8">
    <path d="M640 250 H760 L790 220 H940 L970 190 H1120"/>
    <path d="M660 90 H800 L830 120 H1010 L1040 150 H1140"/>
  </g>
  <g fill="#22d3ee" class="node">
    <circle cx="760" cy="250" r="5"/>
    <circle cx="940" cy="220" r="5"/>
    <circle cx="1120" cy="190" r="5"/>
  </g>
  <g fill="#f472b6" class="node" style="animation-delay:1s">
    <circle cx="800" cy="90" r="5"/>
    <circle cx="1010" cy="120" r="5"/>
    <circle cx="1140" cy="150" r="5"/>
  </g>

  <rect x="0" y="0" width="120" height="320" fill="url(#accent)" opacity="0.08" class="sweep"/>

  <g class="fadeUp d1">
    <text x="80" y="130" class="title">NK Digital Craft</text>
  </g>
  <rect x="80" y="150" width="160" height="4" rx="2" fill="url(#accent)" class="fadeUp d2"/>
  <g class="fadeUp d2">
    <text x="80" y="195" class="sub">WEBSITES · UI/UX · SEO · AI &amp; AUTOMATION</text>
  </g>
  <g class="fadeUp d3">
    <text x="80" y="245" class="tag">Practical digital solutions designed around real business requirements.</text>
  </g>
</svg>
